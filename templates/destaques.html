<section class="destaques">
  <h2>Carros em Destaque</h2>
  <div class="carros-grid">
    {% for carro in carros[:4] %} 
    <div class="car-card">
      <img src="{{ url_for('static', filename='img/' ~ carro.imagem) }}" alt="{{ carro.nome }}">
      <h3>{{ carro.marca }} {{ carro.modelo }}</h3>
      <p>R$ {{ carro.valor_diaria }} / dia</p>
      <a href="{{ url_for('carros') }}" class="btn-alugar">Alugar</a>
    </div>
    {% endfor %}
  </div>
</section>
