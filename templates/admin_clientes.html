<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Admin</title>
</head>
<body>
    <h1>Clientes cadastrados</h1>
    <p><a href="{{ url_for('admin_dashboard') }}">Voltar ao painel</a></p>

    <table border="1" cellpadding="5">
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Email</th>
            <th>Telefone</th>
            <th>CPF</th>
        </tr>
        {% for c in clientes %}
        <tr>
            <td>{{ c.id }}</td>
            <td>{{ c.nome }}</td>
            <td>{{ c.email }}</td>
            <td>{{ c.telefone }}</td>
            <td>{{ c.cpf }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
