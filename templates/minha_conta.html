{% extends "base.html" %}
{% block title %}Minha Conta - AutoPronto{% endblock %}

{% block content %}
<section class="minha-conta-container">

    <div class="perfil-card">
        <img src="{{ url_for('static', filename='img/default-user.png') }}" class="perfil-foto">
        <h2>{{ usuario }}</h2>
        <p class="email">{{ email }}</p>
    </div>

    <div class="info-cards">

        <div class="info-card">
            <h3>Informações Pessoais</h3>
            <p><strong>Nome:</strong> {{ usuario }}</p>
            <p><strong>CPF:</strong> {{ cpf }}</p>
            <p><strong>Telefone:</strong> {{ telefone }}</p>
        </div>

        <div class="info-card">
            <h3>Informações da Conta</h3>
            <p><strong>Email:</strong> {{ email }}</p>
        </div>

    </div>

    <a href="{{ url_for('logout') }}" class="btn-sair">Sair da conta</a>

</section>
{% endblock %}
