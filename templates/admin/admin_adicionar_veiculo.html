{% extends "base.html" %}
{% block title %}{{ "Editar" if carro else "Adicionar" }} Veículo{% endblock %}

{% block content %}

<div class="cadastro-container">
    <div class="form-card">

        <h2>{{ "Editar" if carro else "Adicionar" }} Veículo</h2>

        <a href="{{ url_for('admin_veiculos') }}" class="btn-secondary">Voltar</a>

        <form method="POST" enctype="multipart/form-data">

            <div class="input-group">
                <input type="text" name="marca" placeholder="Marca" 
                       value="{{ carro['marca'] if carro else '' }}" required>
            </div>

            <div class="input-group">
                <input type="text" name="modelo" placeholder="Modelo"
                       value="{{ carro['modelo'] if carro else '' }}" required>
            </div>

            <div class="input-group">
                <input type="text" name="categoria" placeholder="Categoria"
                       value="{{ carro['categoria'] if carro else '' }}">
            </div>

            <div class="input-group">
                <input type="text" name="tipo" placeholder="Tipo"
                       value="{{ carro['tipo'] if carro else '' }}">
            </div>

            <div class="input-group">
                <input type="number" step="0.01" name="valor_diaria" placeholder="Valor diária"
                       value="{{ carro['valor_diaria'] if carro else '' }}">
            </div>

            <div class="input-group">
                <textarea name="descricao" placeholder="Descrição">{{ carro['descricao'] if carro else '' }}</textarea>
            </div>

            <div class="input-group">
                <input type="file" name="imagem">
            </div>

            {% if carro and carro['imagem'] %}
                <p>Imagem atual:</p>
                <img src="{{ url_for('static', filename='img/' ~ carro['imagem']) }}" width="120">
            {% endif %}

            <button type="submit" class="btn-primary">
                {{ "Atualizar" if carro else "Adicionar" }}
            </button>
        </form>

    </div>
</div>

{% endblock %}
