{% extends "base.html" %}
{% block title %}Usuários - Admin{% endblock %}

{% block content %}

<div class="cadastro-container">
    <div class="form-card">

        <h2>Usuários cadastrados</h2>

        <a href="{{ url_for('admin_dashboard') }}" class="btn-secondary">Voltar</a>

        <table class="admin-table">
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>CPF</th>
            </tr>

            {% for c in clientes %}
            <tr>
                <td>{{ c.id }}</td>
                <td>{{ c.nome }}</td>
                <td>{{ c.email }}</td>
                <td>{{ c.telefone }}</td>
                <td>{{ c.cpf }}</td>
            </tr>
            {% endfor %}
        </table>

    </div>
</div>

{% endblock %}
