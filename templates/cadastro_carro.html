{% extends "base.html" %}
{% block title %}Cadastrar Carro - AutoPronto{% endblock %}

{% block content %}
<div class="cadastro-container">
    <div class="form-card">
        <h2>Cadastrar Carro</h2>
        <form method="POST">
            <div class="input-group">
                <label>Modelo</label>
                <input type="text" name="modelo" placeholder="Ex: Onix" required>
            </div>
            <div class="input-group">
                <label>Marca</label>
                <input type="text" name="marca" placeholder="Ex: Chevrolet" required>
            </div>
            <div class="input-group">
                <label>Ano</label>
                <input type="number" name="ano" placeholder="Ex: 2023" required>
            </div>
            <div class="input-group">
                <label>Valor da Diária (R$)</label>
                <input type="number" step="0.01" name="valor_diaria" placeholder="Ex: 120.00" required>
            </div>
            <button class="btn-primary" type="submit">Adicionar Carro</button>
        </form>
    </div>
</div>
{% endblock %}
